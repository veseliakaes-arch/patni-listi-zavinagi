<!DOCTYPE html>
<html lang="bg"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пътни Листи Завинаги</title>
<style>
:root{--bg:#f6f7f9;--fg:#1d2330;--card:#fff;--bd:#d9dde5;--ac:#1b5fd1;--ok:#1a7f45;--bad:#c0392b;--mut:#657089;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--fg:#e6e9ef;--card:#1d2129;--bd:#323846;--ac:#6ea2ff;--ok:#4cc27f;--bad:#ff7a6b;--mut:#9aa4b8}}
:root[data-theme="dark"]{--bg:#14171c;--fg:#e6e9ef;--card:#1d2129;--bd:#323846;--ac:#6ea2ff;--ok:#4cc27f;--bad:#ff7a6b;--mut:#9aa4b8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,Arial,sans-serif}
header{padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--card)}h1{font-size:18px;margin:0}
nav{display:flex;gap:6px;padding:10px 16px;flex-wrap:wrap}nav button{padding:8px 14px}nav .on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:0 16px 40px;max-width:1150px;margin:auto}.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px}label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input,select,textarea,button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 8px}button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--bd);padding:4px;text-align:left;vertical-align:middle}th{font-size:12px;color:var(--mut)}td input{width:100%;min-width:70px}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}.err{color:var(--bad);margin:8px 0}.note{color:var(--mut);font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
</style></head><body>
<header><h1>Пътни Листи Завинаги</h1></header>
<nav id="nav"></nav><main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
<script>
const KEY='pl_v2',FUELS=['Бензин','Дизел','Електрически','Газ (пропан-бутан)','Метан'],U=v=>v.fuel=='Електрически'?'kWh':'л';
const DD=()=>[{id:1,name:'MONA 5, Манастирски ливади-изток',km:9,type:'obj',purpose:''},{id:16,name:'MONA 6, Манастирски ливади-изток',km:9,type:'obj',purpose:''},{id:2,name:'SREDA, Манастирски ливади-изток',km:9,type:'obj',purpose:''},{id:3,name:'UPTOWN SQUARE, Лозенец',km:5,type:'obj',purpose:''},{id:4,name:'SECRET GARDENS, Лозенец',km:6,type:'obj',purpose:''},{id:5,name:'SONATA, ул. Филип Аврамов',km:6,type:'obj',purpose:''},{id:6,name:'AVIVA Living, Възраждане',km:8,type:'obj',purpose:''},{id:7,name:'SLOW LIFE, Владая',km:23,type:'obj',purpose:''},{id:8,name:'KRISTA, Кръстова вада',km:9,type:'obj',purpose:''},{id:9,name:'Столична община, ул. Московска 33',km:5,type:'adm',purpose:''},{id:10,name:'МРРБ, ул. Св. св. Кирил и Методий 17',km:5,type:'adm',purpose:''},{id:11,name:'Съдебна палата, бул. Витоша 2',km:5,type:'adm',purpose:''},{id:12,name:'НАП, Централно управление',km:6,type:'adm',purpose:''},{id:13,name:'Агенция по вписванията',km:7,type:'adm',purpose:''},{id:14,name:'АГКК (Кадастър)',km:8,type:'adm',purpose:''},{id:15,name:'ДНСК',km:6,type:'adm',purpose:''}];
const PURP={client:['Среща с клиент на адрес','Оглед при клиент','Консултация при клиент','Връчване на документи на клиент'],obj:['Оглед на обект','Контрол на СМР','Среща с подизпълнител','Среща с клиент','Приемане на изпълнени СМР','Контрол на доставка на материали'],adm:['Подаване на документи','Получаване на документи','Среща в администрацията','Справка и съгласуване']};
let S=load(),TAB='new',DRAFT=null,ERR='';
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s){s.offices=s.offices||[];s.clients=s.clients||[];if(s.dv!==2){const nd=DD();s.dests=[...nd.map(n=>{const o=s.dests.find(x=>x.id==n.id);return o?Object.assign(o,{name:n.name,km:n.km,type:n.type}):n}),...s.dests.filter(x=>!nd.some(n=>n.id==x.id))];s.dv=2}return s}}catch(e){}
return{company:{name:'BLD (допълнете пълното наименование)',eik:'',addr:'гр. София, ул. „Тинтява“ 126',mol:''},
base:'BLD – офис, ул. „Тинтява“ 126, София',vehicles:[{id:1,make:'Škoda',model:'Octavia',plate:'СВ 1234 АА',fuel:'Дизел',cons:5.8,odo:45000}],
drivers:[{id:1,name:'Петър Петров',pos:'Търговски представител'}],
dests:DD(),
offices:[],clients:[],dv:2,sheets:[],seq:0}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id), nf=(n,d=2)=>Number(n).toFixed(d).replace('.',','), pad=(n,l)=>String(n).padStart(l,'0');
const dm=iso=>iso.split('-').reverse().join('.');
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rint(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
/* ---------- алгоритъм ---------- */
const HOL=['01-01','03-03','05-01','05-06','05-24','09-06','09-22','12-24','12-25','12-26'];
function parseOff(t){const s=new Set();(t||'').split(/[,;\s]+/).filter(Boolean).forEach(x=>{const [a,b]=x.split('..');if(!b)s.add(a);else{for(let d=Date.parse(a);d<=Date.parse(b);d+=864e5)s.add(new Date(d).toISOString().slice(0,10))}});return s}
function workdays(a,b,off){const r=[];for(let d=Date.parse(a);d<=Date.parse(b);d+=864e5){const D=new Date(d),iso=D.toISOString().slice(0,10),w=D.getUTCDay();if(w>0&&w<6&&!off.has(iso)&&!HOL.includes(iso.slice(5)))r.push(iso)}return r}
var CUR={s:0,e:0};
function P(id){return id==0?{id:0,name:S.base,km:0,purpose:''}:S.offices.concat(S.dests,S.clients).find(x=>x.id==id)||{id,name:'?',km:0,purpose:''}}
function dist(a,b){if(a.id==b.id)return 0;const m=S.matrix&&S.matrix[a.id+'|'+b.id];if(m!=null)return Math.max(1,Math.round(m));if(a.id==0)return b.km;if(b.id==0)return a.km;return Math.max(3,Math.round(.6*Math.min(a.km,b.km)+.5*Math.abs(a.km-b.km)))}
function N(t){if(t.from!==undefined)return t;const p=(t.route||'').split(' → ');return{from:p[0],to:p[p.length-1],via:p.slice(1,-1).join('; ')}}
function combos(dests,max,s=0,e=0){const o=[],A=P(s),B=P(e),vs=dests.filter(d=>d.id!=s&&d.id!=e),chain=ids=>{let p=A,k=0;ids.forEach(i=>{const q=P(i);k+=dist(p,q);p=q});return k+dist(p,B)};
if(s!=e){const k=chain([]);if(k>0&&k<=max)o.push({ids:[],km:k})}
vs.forEach((a,i)=>{const k=chain([a.id]);if(k>0&&k<=max)o.push({ids:[a.id],km:k});vs.forEach((b,j)=>{if(j>i){const k2=chain([a.id,b.id]);if(k2<=max)o.push({ids:[a.id,b.id],km:k2});vs.forEach((c,l)=>{if(l>j){const k3=chain([a.id,b.id,c.id]);if(k3<=max)o.push({ids:[a.id,b.id,c.id],km:k3})}})}})});return o}
function generate(T,days,dests,max,s=0,e=0,mp=3){
if(T<0)throw'Отрицателен пробег';if(T===0)return[];if(!days.length)throw'Няма работни дни в периода';
const opts=combos(dests,max-5,s,e),mo=opts.length?Math.max(...opts.map(o=>o.km)):0,cap=days.length*Math.min(max-5,mp*Math.max(mo,50));
if(T>cap)throw`Пробегът е твърде голям за ${days.length} работни дни – най-много около ${cap} км. Намалете го или добавете работни дни.`;
const key=o=>o.ids.join('-'),minKm=opts.length?Math.min(...opts.map(o=>o.km)):Infinity,avg=opts.length?opts.reduce((a,o)=>a+o.km,0)/opts.length:0,rcap=Math.floor(.6*days.length*Math.min(max-5,mp*avg));let trips=[],rem=T,rs=0,last='';
while(rem>=minKm+6){const ok=o=>o.km<=rem-6&&rs+o.km<=rcap;let c=opts.filter(o=>ok(o)&&key(o)!==last);if(!c.length)c=opts.filter(ok);if(!c.length)break;
const w=c.flatMap(o=>Array(o.ids.length||1).fill(o)),o=w[rint(0,w.length-1)];trips.push({ids:o.ids,km:o.km,base:o.km});rem-=o.km;rs+=o.km;last=key(o)}
/* разликата се покрива с посещения на личен адрес на клиент – до 25 км в посока (до 50 км общо) */
const CL=(S.clients||[]).filter(c=>c.km>=1&&c.km<=25);let g=0;
while(rem>=6&&CL.length&&g++<400){const fit=c=>2*c.km<=rem&&(rem-2*c.km===0||rem-2*c.km>=6);let o=CL.filter(c=>fit(c)&&2*c.km>=Math.min(rem,40));if(!o.length)o=CL.filter(fit);if(!o.length)break;const c=o[rint(0,o.length-1)];trips.push({ids:[c.id],km:2*c.km,base:2*c.km,client:true});rem-=2*c.km}
if(rem>=2){const n=Math.ceil(rem/50),b=Math.floor(rem/n),x=rem%n;for(let i=0;i<n;i++){const k=b+(i<x?1:0);trips.push({ids:[],km:k,base:k,client:true,cname:'Клиент – личен адрес (допълнете адреса)'})}}
if(!trips.length)return[];
const n=trips.length,m=Math.min(days.length,n),use=shuffle(days).slice(0,m).sort(),load={};use.forEach(d=>load[d]=[]);
const sh=shuffle(trips);sh.forEach((t,i)=>{if(i<m)load[use[i]].push(t)});
for(let i=m;i<n;i++){const t=sh[i],c=use.filter(d=>load[d].length<mp+(t.client?2:0)&&load[d].reduce((s,x)=>s+x.km,0)+t.km<=max);
const pool=c.length?c:days.filter(d=>(load[d]||[]).length<mp+(t.client?2:0)&&(load[d]||[]).reduce((s,x)=>s+x.km,0)+t.km<=max);if(!pool.length)throw'Този пробег не може да се разпредели по дните – намалете го, добавете работни дни или клиентски адреси.';
const d=pool[rint(0,pool.length-1)];(load[d]=load[d]||[]).push(t)}
const out=[];Object.keys(load).sort().forEach(d=>load[d].forEach(t=>out.push({...t,date:d})));return out}
function describe(t){const s=t.fromId??CUR.s,e=t.toId??CUR.e;t.fromId=s;t.toId=e;const ds=t.ids.map(P);t.from=P(s).name;t.to=P(e).name;t.via=t.cname||ds.map(d=>d.name).join('; ');const pu=d=>d.type?PURP[d.type][rint(0,PURP[d.type].length-1)]:d.purpose;t.purpose=[...new Set([P(s),...ds,P(e)].filter(d=>d.id!=0&&d.type!='office').map(pu).filter(Boolean))].join('; ')||'Служебна задача';t.route=[t.from,...ds.map(d=>d.name),t.to].join(' → ');if(t.cname){t.purpose=PURP.client[rint(0,PURP.client.length-1)];t.route=[t.from,t.cname,t.to].join(' → ')}}
function recalc(D){let o=D.startOdo;D.trips.forEach(t=>{t.km=Math.max(0,+t.km||0);t.s=o;o+=t.km;t.e=o;t.l=Math.round(t.km*D.vehicle.cons)/100});
D.sumKm=D.trips.reduce((s,t)=>s+t.km,0);D.target=D.endOdo-D.startOdo-D.personal;D.diff=D.sumKm-D.target;D.liters=D.trips.reduce((s,t)=>s+t.l,0)}
/* ---------- UI ---------- */
function render(){$('nav').innerHTML=[['new','Нов пътен лист'],['hist','История'],['set','Автомобили, водачи, дестинации']].map(([k,l])=>`<button class="${TAB==k?'on':''}" onclick="TAB='${k}';render()">${l}</button>`).join('');
$('app').innerHTML=TAB=='set'?vSet():TAB=='hist'?vHist():vNew();if(TAB=='new'){syncOdo(true);drvBase()}}
function inp(l,id,v,t='text',x=''){return`<div><label>${l}</label><input id="${id}" type="${t}" value="${esc(v)}" ${x}></div>`}
function grid(k,cols,tpl){return`<div class="sc"><table><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}<th></th></tr>${S[k].map((r,i)=>`<tr>${cols.map(c=>c[2]=='c'?`<td><input type="number" min="1" max="25" value="${esc(r[c[0]])}" onchange="const v=Math.max(1,Math.min(25,Math.round(+this.value)||1));this.value=v;S['${k}'][${i}]['${c[0]}']=v;save()"></td>`:c[2]=='f'?`<td><select onchange="S['${k}'][${i}]['${c[0]}']=this.value;save()">${[...new Set([...FUELS,r[c[0]]].filter(Boolean))].map(x=>`<option ${x==r[c[0]]?'selected':''}>${esc(x)}</option>`).join('')}</select></td>`:c[2]=='s'?`<td><select onchange="S['${k}'][${i}]['${c[0]}']=+this.value;save()">${ptOpts(r[c[0]]??0)}</select></td>`:`<td><input type="${c[2]=='n'?'number':'text'}" step="any" value="${esc(r[c[0]])}" oninput="S['${k}'][${i}]['${c[0]}']=${c[2]=='n'?'+this.value':'this.value'};save()"></td>`).join('')}<td><button onclick="delRow('${k}',${i})">✕</button></td></tr>`).join('')}</table></div><div class="row"><button onclick='addRow("${k}",${JSON.stringify(tpl)})'>+ Добави</button></div>`}
function addRow(k,t){S[k].push({...t,id:Date.now()});save();render()}
function delRow(k,i){S[k].splice(i,1);save();render()}
function vSet(){const c=S.company;return`<div class="card"><h2>Данни на фирмата</h2><div class="g">
${['name:Име','eik:ЕИК','addr:Адрес','mol:МОЛ'].map(x=>{const[f,l]=x.split(':');return`<div><label>${l}</label><input value="${esc(c[f])}" oninput="S.company.${f}=this.value;save()"></div>`}).join('')}
<div><label>Базов адрес (офис)</label><input value="${esc(S.base)}" oninput="S.base=this.value;save()"></div></div></div>
<div class="card"><h2>Автомобили</h2>${grid('vehicles',[['make','Марка'],['model','Модел'],['plate','Рег. номер'],['fuel','Гориво','f'],['cons','Разход на 100 км (л или kWh)','n'],['odo','Начален километраж','n']],{make:'',model:'',plate:'',fuel:'Бензин',cons:7,odo:0})}</div>
<div class="card"><h2>Водачи</h2>${grid('drivers',[['name','Име'],['pos','Длъжност'],['base','Офис на водача (начална и крайна точка по подразбиране)','s']],{name:'',pos:'',base:0})}</div>
<div class="card"><h2>Реални разстояния (OSRM)</h2><p class="note">Заредете distances.json от инструмента „izchisli-razstoyaniya.html“. Разстоянията в таблиците по-долу се обновяват от файла (в една посока от основния офис).</p><input type="file" accept=".json" onchange="impMatrix(this)"> <span class="note">${S.matrix?Object.keys(S.matrix).length+' двойки заредени':'не са заредени'}</span></div>
<div class="card"><h2>Други офиси (напр. офиси на служители)</h2><p class="note">Могат да се избират за начална и крайна точка. Км – от основния офис, в една посока (ориентировъчно, редактирайте).</p>${grid('offices',[['name','Офис / адрес'],['km','Км от основния офис','n']],{name:'',km:10,type:'office',purpose:''})}</div>
<div class="card"><h2>Адреси на клиенти (личен адрес)</h2><p class="note">Посещения на клиенти на техен адрес. Км – в една посока от основния офис, най-много 25. Системата ги ползва и за покриване на разликата до въведения пробег (до 25 км в посока).</p>${grid('clients',[['name','Клиент / адрес'],['km','Км в една посока (макс. 25)','c']],{name:'',km:10,type:'client',purpose:''})}</div>
<div class="card"><h2>Дестинации и разстояния (км в една посока от базата)</h2><p class="note">Разстоянията са ориентировъчни (в една посока от офиса) – заменете ги с реални от OSRM/Google Maps.</p>${grid('dests',[['name','Дестинация'],['km','Км (в една посока)','n'],['purpose','Цел на пътуването']],{name:'',km:10,purpose:'Служебна задача'})}
<div class="row"><label style="margin:0">Импорт от Excel (колони: име, км, цел):</label><input type="file" accept=".xlsx,.xls,.csv" onchange="impDest(this)"></div></div>`}
async function impMatrix(el){try{const j=JSON.parse(await el.files[0].text()),km=j.km||j;if(typeof km!=='object')throw 0;S.matrix=km;S.dests.concat(S.offices).forEach(d=>{const v=km['0|'+d.id];if(v!=null)d.km=Math.max(1,Math.round(v))});save();render();toast('Заредени разстояния: '+Object.keys(km).length)}catch(e){toast('Невалиден файл с разстояния.')}}
async function impDest(el){try{const wb=XLSX.read(await el.files[0].arrayBuffer()),r=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});let n=0;r.forEach((x,i)=>{if(x[0]&&+x[1]>0){S.dests.push({id:Date.now()+i,name:String(x[0]),km:Math.round(+x[1]),purpose:String(x[2]||'Служебна задача')});n++}});save();render();toast('Импортирани: '+n)}catch(e){toast('Грешка при импорт')}}
const vs=vid=>S.sheets.filter(s=>s.vehicle.id==vid),prevSheet=(vid,pf)=>vs(vid).filter(s=>s.to<pf).sort((a,b)=>a.to<b.to?-1:1).pop(),nextSheet=(vid,pt)=>vs(vid).filter(s=>s.from>pt).sort((a,b)=>a.from<b.from?-1:1)[0];
let SEL=[];const ptOpts=sel=>{const o=(id,n)=>`<option value="${id}" ${sel!==undefined&&String(sel)==String(id)?'selected':''}>${esc(n)}</option>`;return o(0,S.base+' (основен офис)')+(S.offices.length?'<optgroup label="Други офиси">'+S.offices.map(x=>o(x.id,x.name)).join('')+'</optgroup>':'')+'<optgroup label="Обекти и администрации">'+S.dests.map(d=>o(d.id,d.name)).join('')+'</optgroup>'};
function vNew(){const v=S.vehicles,d=DRAFT;const td=today(),ms=td.slice(0,8)+'01',me=new Date(Date.UTC(+td.slice(0,4),+td.slice(5,7),0)).toISOString().slice(0,10);
return`<div class="card"><h2>1. Въвеждане на километри</h2><div class="g">
<div><label>Автомобил</label><select id="veh" onchange="syncOdo(true)">${v.map(x=>`<option value="${x.id}">${esc(x.plate)} – ${esc(x.make)} ${esc(x.model)}</option>`).join('')}</select></div>
<div><label>Водач</label><select id="drv" onchange="drvBase()">${S.drivers.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>
<div><label>Начална точка</label><select id="sp">${ptOpts()}</select></div><div><label>Крайна точка</label><select id="ep">${ptOpts()}</select></div>
<div><label>Режим</label><select id="md"><option value="all">Всички обекти</option><option value="selected">Избрани обекти</option><option value="direct">Само начална и крайна точка</option></select></div>
<div><label>Избрани обекти (за режим „Избрани“; Ctrl/Cmd за няколко)</label><select id="sel" multiple size="4" onchange="SEL=[...this.selectedOptions].map(o=>o.value)">${S.dests.concat(S.clients).map(d=>`<option value="${d.id}" ${SEL.includes(String(d.id))?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div>
${inp('Месец','mo',td.slice(0,7),'month','onchange="setMonth()"')}${inp('Период от','pf',ms,'date','onchange="syncOdo(true)"')}${inp('Период до','pt',me,'date','onchange="syncOdo(true)"')}
${inp('Начален километраж (автоматично)','so','','number','oninput="syncOdo()"')}${inp('Краен километраж (автоматично)','eo','','number','oninput="syncTot(0)"')}${inp('Изминати км за периода (въведете тук)','tk','','number','oninput="syncTot(1)"')}
${inp('От тях лични км','pk','0','number')}${inp('Макс. дневен пробег (км)','mx','300','number')}</div>
<div><label style="margin-top:10px">Зареждания (по избор, ред: дата;литри;№ фактура)</label><textarea id="ref" rows="2" style="width:100%"></textarea></div>
<div id="err" class="err">${esc(ERR)}</div><div class="row"><button class="p" onclick="gen()">Генерирай маршрути</button><button onclick="selfTest()">Самотест на алгоритъма</button><span id="st" class="note"></span></div></div>${d?vReview():''}`}
function drvBase(){const d=S.drivers.find(x=>x.id==$('drv').value),b=d&&d.base!=null?d.base:0;if($('sp'))$('sp').value=b;if($('ep'))$('ep').value=b}
function setMonth(){const v=$('mo').value;if(!/^\d{4}-\d{2}$/.test(v))return;const[y,m]=v.split('-').map(Number);$('pf').value=v+'-01';$('pt').value=new Date(Date.UTC(y,m,0)).toISOString().slice(0,10);syncOdo(true)}
function syncOdo(init){const s=$('so');if(!s)return;if(init){const v=S.vehicles.find(x=>x.id==$('veh').value);if(!v)return;const l=prevSheet(v.id,$('pf').value);s.value=l?l.endOdo:v.odo}syncTot(1)}
function syncTot(by){const s=+$('so').value;if(by)$('eo').value=s+(+$('tk').value||0)||'';else $('tk').value=(+$('eo').value-s)}
function gen(){ERR='';try{const v=S.vehicles.find(x=>x.id==$('veh').value),dr=S.drivers.find(x=>x.id==$('drv').value);if(!v||!dr)throw'Изберете автомобил и водач';
const so=+$('so').value,eo=+$('eo').value,pk=+$('pk').value||0,pf=$('pf').value,pt=$('pt').value,mx=+$('mx').value||300;
if(!pf||!pt||pt<pf)throw'Невалиден период';if(eo<so)throw'Крайният километраж не може да е по-малък от началния';
const ov=vs(v.id).find(x=>x.from<=pt&&x.to>=pf);if(ov)throw`Периодът се припокрива с вече издадения ${ov.no} (${dm(ov.from)} – ${dm(ov.to)}) за същия автомобил. Изберете друг период или автомобил, или изтрийте листа от „История“ (само ако е последният издаден).`;const l=prevSheet(v.id,pf),nx=nextSheet(v.id,pt);if(l&&so!==l.endOdo)throw`Началният километраж трябва да е ${l.endOdo} км – краят на предишния период (${dm(l.from)} – ${dm(l.to)})`;if(nx&&eo!==nx.startOdo)throw`Крайният километраж трябва да е ${nx.startOdo} км – началото на следващия период (${dm(nx.from)} – ${dm(nx.to)})`
if(pk<0||pk>eo-so)throw'Невалидни лични км';if(eo-so-pk<=0)throw'Въведете изминати километри за периода';
const sp=+$('sp').value,ep=+$('ep').value,md=$('md').value;let dl=md=='all'?S.dests.concat(S.clients):md=='selected'?S.dests.concat(S.clients).filter(d=>SEL.includes(String(d.id))):[];
if(md=='selected'&&!dl.length)throw'Изберете поне един обект';if(md=='direct'&&sp==ep)throw'В режим „само начална и крайна точка“ изберете различни точки';
CUR={s:sp,e:ep};const days=workdays(pf,pt,new Set()),trips=generate(eo-so-pk,days,dl,mx,sp,ep,md=='direct'?6:3);if(md=='direct'){const c={};trips.forEach(t=>{c[t.date]=(c[t.date]||0)+1;if(c[t.date]%2==0){t.fromId=ep;t.toId=sp}})}trips.forEach(t=>describe(t));
DRAFT={company:{...S.company},vehicle:{...v},driver:{...dr},base:S.base,from:pf,to:pt,startOdo:so,endOdo:eo,personal:pk,refuels:$('ref').value,trips,params:{pf,pt,mx,off:'',s:sp,e:ep,dl:dl.map(d=>d.id)}};recalc(DRAFT)}catch(e){ERR=String(e.message||e);DRAFT=null}
const k=snap();render();restore(k)}
function vReview(){const d=DRAFT;return`<div class="card"><h2>2. Преглед и редакция</h2><div class="sc"><table><tr><th>Дата</th><th>Начална точка</th><th>През</th><th>Крайна точка</th><th>Цел</th><th>Нач. км</th><th>Изм. км</th><th>Крайни км</th><th>${d.vehicle.fuel=='Електрически'?'kWh':'Литри'} (${esc(d.vehicle.fuel.toLowerCase())})</th><th></th></tr>
${d.trips.map((t,i)=>`<tr><td><input type="date" value="${t.date}" onchange="DRAFT.trips[${i}].date=this.value"></td><td><input style="min-width:150px" value="${esc(t.from)}" oninput="DRAFT.trips[${i}].from=this.value"></td><td><input style="min-width:150px" placeholder="директно" value="${esc(t.via)}" oninput="DRAFT.trips[${i}].via=this.value"></td><td><input style="min-width:150px" value="${esc(t.to)}" oninput="DRAFT.trips[${i}].to=this.value"></td><td><input value="${esc(t.purpose)}" oninput="DRAFT.trips[${i}].purpose=this.value"></td><td>${t.s}</td><td><input type="number" style="width:80px" value="${t.km}" onchange="DRAFT.trips[${i}].km=+this.value;upd()"></td><td>${t.e}</td><td>${nf(t.l)}</td><td style="white-space:nowrap"><button title="Прегенерирай маршрута" onclick="regen(${i})">↻</button> <button onclick="DRAFT.trips.splice(${i},1);upd()">✕</button></td></tr>`).join('')}</table></div>
<p>Сума на маршрутите: <b>${d.sumKm} км</b> · Въведени (без лични): <b>${d.target} км</b> · Разлика: <span class="${Math.abs(d.diff)<=1?'ok':'bad'}">${d.diff>0?'+':''}${d.diff} км ${Math.abs(d.diff)<=1?'(в толеранса ±1 км)':'(над толеранса!)'}</span><br>Нормативен разход на гориво (${esc(d.vehicle.fuel)}): <b>${nf(d.liters)} ${U(d.vehicle)}</b> (${nf(d.vehicle.cons,1)} ${U(d.vehicle)}/100 км) · Лични км: ${d.personal}</p>
<div class="row"><button onclick="gen()">Прегенерирай всичко</button><button class="p" ${Math.abs(d.diff)>1?'disabled':''} onclick="saveSheet()">Издай пътен лист</button></div></div>`}
const IDS=['veh','drv','sp','ep','md','mo','pf','pt','so','eo','tk','pk','mx','ref'];const snap=()=>IDS.map(i=>$(i)?$(i).value:undefined),restore=k=>IDS.forEach((i,x)=>{if($(i)&&k[x]!==undefined)$(i).value=k[x]});
function upd(){recalc(DRAFT);const k=window.scrollY,f=snap();render();restore(f);scrollTo(0,k)}
function regen(i){const t=DRAFT.trips[i];if(t.client){toast('Посещенията при клиенти се редактират ръчно (колоната „През“).');return}const o=combos(S.dests.concat(S.clients).filter(d=>DRAFT.params.dl.includes(d.id)),DRAFT.params.mx-5,DRAFT.params.s,DRAFT.params.e).filter(o=>Math.abs(o.km-t.km)<=Math.max(8,t.km*.15)&&o.ids.join()!=t.ids.join());if(!o.length){toast('Няма подходяща алтернатива с този пробег');return}
const c=o[rint(0,o.length-1)];t.ids=c.ids;t.base=c.km;describe(t);upd()}
function saveSheet(){const d=DRAFT;d.trips=d.trips.filter(t=>t.km>0);recalc(d);if(Math.abs(d.diff)>1)return;if(d.trips.some(t=>!t.date||t.date<d.from||t.date>d.to)){toast('Има маршрути с дата извън избрания период.');return}d.trips.sort((a,b)=>a.date<b.date?-1:1);recalc(d);S.seq++;d.no=`ПЛ-${d.to.slice(0,4)}-${pad(S.seq,4)}`;d.issued=today();S.sheets.push(d);save();DRAFT=null;TAB='hist';render()}
function toast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:9;max-width:90%';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',7000)}
let CONF='';
function delSheet(i){if(CONF!=='d'+i){CONF='d'+i;render();return}CONF='';S.sheets.splice(i,1);S.seq=Math.max(0,...S.sheets.map(z=>parseInt(z.no.slice(-4),10)||0));save();render();toast('Листът е изтрит.')}
function resetSheets(){if(CONF!=='r'){CONF='r';render();return}CONF='';S.sheets=[];S.seq=0;save();render();toast('Всички листове са изтрити.')}
function vHist(){const fv=window.FV||'',ff=window.FF||'',ft=window.FT||'';const L=S.sheets.filter(s=>(!fv||s.vehicle.id==fv)&&(!ff||s.to>=ff)&&(!ft||s.from<=ft));
return`<div class="card"><h2>История на пътните листа</h2><div class="g"><div><label>Автомобил</label><select onchange="FV=this.value;render()"><option value="">Всички</option>${S.vehicles.map(v=>`<option value="${v.id}" ${fv==v.id?'selected':''}>${esc(v.plate)}</option>`).join('')}</select></div><div><label>От</label><input type="date" value="${ff}" onchange="FF=this.value;render()"></div><div><label>До</label><input type="date" value="${ft}" onchange="FT=this.value;render()"></div></div>
<div class="sc"><table style="margin-top:10px"><tr><th>№</th><th>Издаден</th><th>Автомобил</th><th>Период</th><th>Км</th><th>Разход</th><th></th></tr>${L.map(s=>{const i=S.sheets.indexOf(s);return`<tr><td>${s.no}</td><td>${dm(s.issued)}</td><td>${esc(s.vehicle.plate)}</td><td>${dm(s.from)} – ${dm(s.to)}</td><td>${s.endOdo-s.startOdo}</td><td>${nf(s.liters)} ${U(s.vehicle)} (${esc(s.vehicle.fuel.toLowerCase())})</td><td style="white-space:nowrap"><button onclick="expPdf([${i}])">PDF</button> <button onclick="expXls([${i}])">Excel</button>${CONF=='d'+i?`<button class="p" onclick="delSheet(${i})">Потвърди изтриването</button> <button onclick="CONF='';render()">Отказ</button>`:`<button onclick="delSheet(${i})">Изтрий</button>`}</td></tr>`}).join('')||'<tr><td colspan=7 class="note">Няма издадени листове</td></tr>'}</table></div>
<div class="row"><button ${L.length?'':'disabled'} onclick="expPdf([${L.map(s=>S.sheets.indexOf(s))}])">Експорт на всички филтрирани – PDF</button><button ${L.length?'':'disabled'} onclick="expXls([${L.map(s=>S.sheets.indexOf(s))}])">Експорт на всички филтрирани – Excel</button></div>
${CONF=='r'?`<div class="row"><b class="bad">Да се изтрият ли ВСИЧКИ листове и номерацията да започне отначало?</b><button class="p" onclick="resetSheets()">Да, изтрий всички</button><button onclick="CONF='';render()">Отказ</button></div>`:`<div class="row"><button onclick="resetSheets()">Изтрий всички листове</button></div>`}${CONF[0]=='d'&&S.sheets[+CONF.slice(1)]?`<p class="bad">${S.sheets[+CONF.slice(1)].no}: ${+CONF.slice(1)===S.sheets.length-1?'номерът ще бъде освободен.':'в номерацията ще остане пропуск – за данъчни цели изтривайте само листове, които не са отпечатани или използвани.'}</p>`:''}
<p class="note">Номерацията е последователна без пропуски – изтриването на лист, който не е последният, оставя пропуск в номерацията. Данните се пазят в браузъра.</p></div>`}
/* ---------- експорт ---------- */
async function saveFile(name,bytes){let dl=null;try{dl=await claude.use('downloads')}catch(e){}
if(dl){try{await dl.save({filename:name,data:bytes})}catch(e){if(!e||e.code!='declined')toast('Свалянето не успя: '+((e&&(e.message||e.code))||'неизвестна грешка'))}return}
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes]));a.download=name;a.click()}
function pdfSheet(s,first){const H=(t,w)=>({text:t,bold:true,fillColor:'#eeeeee',fontSize:8,alignment:w||'left'}),C=(t,a)=>({text:String(t),fontSize:8,alignment:a||'left'});
const rows=[[H('№'),H('Дата'),H('Начална точка'),H('През'),H('Крайна точка'),H('Цел на пътуването'),H('Нач. км','right'),H('Крайни км','right'),H('Изм. км','right'),H('Разход '+s.vehicle.fuel.toLowerCase()+', '+U(s.vehicle),'right')],
...s.trips.map((t,i)=>[C(i+1),C(dm(t.date)),C(N(t).from),C(N(t).via||'—'),C(N(t).to),C(t.purpose),C(t.s,'right'),C(t.e,'right'),C(t.km,'right'),C(nf(t.l),'right')]),
...(s.personal?[[C(''),C(''),C('Лично ползване (отчетено отделно)'),C(''),C(''),C(''),C(s.startOdo+s.sumKm,'right'),C(s.endOdo,'right'),C(s.personal,'right'),C('')]]:[]),
[{text:'ОБЩО за периода',colSpan:6,bold:true,fontSize:8},{},{},{},{},{},C(s.startOdo,'right'),C(s.endOdo,'right'),C(s.endOdo-s.startOdo,'right'),C(nf(s.liters),'right')]];
const f=s.refuels.split('\n').filter(x=>x.trim());
return[{text:`ПЪТЕН ЛИСТ № ${s.no}`,fontSize:15,bold:true,alignment:'center',pageBreak:first?undefined:'before'},{text:`Дата на издаване: ${dm(s.issued)} · Период: ${dm(s.from)} – ${dm(s.to)}`,alignment:'center',fontSize:9,margin:[0,2,0,8]},
{columns:[{width:'*',fontSize:9,text:[{text:'Фирма: ',bold:true},`${s.company.name}\nЕИК: ${s.company.eik}\nАдрес: ${s.company.addr}\nМОЛ: ${s.company.mol}`]},{width:'*',fontSize:9,text:[{text:'Автомобил: ',bold:true},`${s.vehicle.make} ${s.vehicle.model}, ${s.vehicle.plate}\nГориво: ${s.vehicle.fuel}\nНорма: ${nf(s.vehicle.cons,1)} ${U(s.vehicle)}/100 км\n`,{text:'Водач: ',bold:true},`${s.driver.name}${s.driver.pos?' ('+s.driver.pos+')':''}`]}]},
{table:{headerRows:1,widths:[16,42,'*',90,'*',85,40,40,34,52],body:rows},margin:[0,10,0,6],layout:'lightHorizontalLines'},
{fontSize:9,text:`Начален километраж: ${s.startOdo} · Краен: ${s.endOdo} · Изминати: ${s.endOdo-s.startOdo} км (служебни ${s.sumKm}, лични ${s.personal}). Нормативен разход на гориво (${s.vehicle.fuel}): ${s.sumKm} км × ${nf(s.vehicle.cons,1)} ${U(s.vehicle)}/100 км = ${nf(s.liters)} ${U(s.vehicle)}.`},
{fontSize:9,margin:[0,4,0,0],text:'Зареждания: '+(f.length?f.map(x=>{const p=x.split(';');return`${p[0]||''}, ${p[1]||''} л, фактура ${p[2]||'-'}`}).join(' | '):'няма отчетени')},
{columns:[{text:'\n\n______________________\nВодач: '+s.driver.name,fontSize:9},{text:'\n\n______________________\nОдобрил (ръководител/МОЛ): '+s.company.mol,fontSize:9,alignment:'right'}],margin:[0,20,0,0]}]}
function expPdf(ix){const c=ix.flatMap((i,k)=>pdfSheet(S.sheets[i],!k));pdfMake.createPdf({pageSize:'A4',pageOrientation:'landscape',pageMargins:[28,28,28,28],content:c,defaultStyle:{font:'Roboto'}}).getBuffer(b=>saveFile(ix.length==1?S.sheets[ix[0]].no+'.pdf':'pateni-listove.pdf',b))}
function expXls(ix){const wb=XLSX.utils.book_new();ix.forEach(i=>{const s=S.sheets[i],a=[[`ПЪТЕН ЛИСТ № ${s.no}`],['Дата на издаване',dm(s.issued),'Период',`${dm(s.from)} – ${dm(s.to)}`],['Фирма',s.company.name,'ЕИК',s.company.eik],['Адрес',s.company.addr,'МОЛ',s.company.mol],['Автомобил',`${s.vehicle.make} ${s.vehicle.model}`,'Рег. номер',s.vehicle.plate],['Гориво',s.vehicle.fuel,'Норма '+U(s.vehicle)+'/100 км',s.vehicle.cons],['Водач',s.driver.name,'Длъжност',s.driver.pos],[],
['№','Дата','Начална точка','През','Крайна точка','Цел на пътуването','Начален км','Краен км','Изминати км','Разход '+s.vehicle.fuel.toLowerCase()+', '+U(s.vehicle)],
...s.trips.map((t,k)=>[k+1,dm(t.date),N(t).from,N(t).via||'—',N(t).to,t.purpose,t.s,t.e,t.km,t.l]),...(s.personal?[['','','Лично ползване','','','',s.startOdo+s.sumKm,s.endOdo,s.personal,'']]:[]),
['','','ОБЩО за периода','','','',s.startOdo,s.endOdo,s.endOdo-s.startOdo,Math.round(s.liters*100)/100],[],['Зареждания (дата;литри;фактура)',s.refuels.replace(/\n/g,' | ')],[],['Водач: ____________','','Одобрил: ____________']],ws=XLSX.utils.aoa_to_sheet(a);
ws['!cols']=[{wch:14},{wch:12},{wch:34},{wch:30},{wch:34},{wch:30},{wch:12},{wch:12},{wch:12},{wch:10}];XLSX.utils.book_append_sheet(wb,ws,s.no)});
saveFile(ix.length==1?S.sheets[ix[0]].no+'.xlsx':'pateni-listove.xlsx',new Uint8Array(XLSX.write(wb,{type:'array',bookType:'xlsx'})))}
function selfTest(){let bad=0,inf=0,ok=0,n=300;const days=workdays('2026-09-01','2026-09-30',new Set());CUR={s:0,e:0};for(let i=0;i<n;i++){const T=rint(1,1200);try{const t=generate(T,days,S.dests,300),sm=t.reduce((a,x)=>a+x.km,0),dl={};t.forEach(x=>dl[x.date]=(dl[x.date]||0)+x.km);if(Math.abs(sm-T)>1||Object.values(dl).some(v=>v>300)||t.some(x=>!days.includes(x.date)))bad++;else ok++}catch(e){inf++}}
$('st').textContent=`Генерирания: ${n} · верни: ${ok} · грешни: ${bad} · неразпределими: ${inf} (пробег 1–1200 км, септември 2026)`}
render();
</script></body></html>
